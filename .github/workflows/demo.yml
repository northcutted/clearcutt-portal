# Publishes this repository's demo portal, built from the contract fixture
# (the clearcutt-factory example fleet, ghcr.io/northcutted/images), through
# the same reusable workflow fleets use.
name: demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-bundle
          path: |
            contract/fixtures/northcutted-images/estate-report.json
            contract/fixtures/northcutted-images/estate-history.json

  portal:
    needs: bundle
    uses: ./.github/workflows/portal.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      bundle-artifact: demo-bundle
      title: ClearCutt Portal demo
      portal-version: ${{ github.sha }}
