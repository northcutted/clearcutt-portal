name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release tags, for the contract's changelog check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Types check, and match the vendored contract
        run: npm run check
      - run: npm test
      - name: The vendored contract matches clearcutt-verify at the pinned commit
        run: scripts/sync-contract.sh --check
      - name: A schema change since the last release has a CHANGELOG entry
        run: scripts/check-contract-changelog.sh

  # A synthetic 500-image estate with 1,000 runs of history
  # (scripts/gen-fixture.ts) builds within the budget in test/scale.test.ts,
  # into a site that doesn't grow with the history.
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the synthetic estate within the time budget
        env:
          CLEARCUTT_PORTAL_SCALE: "1"
        run: node --test test/scale.test.ts

  # The site's scripts in a browser (sorting, filters, the package search,
  # copy buttons, chips, the theme) and an axe pass over its pages in both
  # themes: e2e/*.spec.ts, against a site e2e/site.ts builds. Chromium's
  # headless shell only, cached by Playwright's version.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The action as a fleet uses it, from source.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: portal
        uses: ./
        with:
          bundle: contract/examples/minimal
          base-path: /some-portal
          title: CI
      - name: The site is there, under the base path
        env:
          DIR: ${{ steps.portal.outputs.dir }}
        run: |
          test -f "$DIR/index.html"
          test -f "$DIR/images/docker-io-library-redis-7/index.html"
          grep -q 'href="/some-portal/bases/"' "$DIR/index.html"
          grep -q '<title>Overview · CI</title>' "$DIR/index.html"

  # What a release publishes: the source archive alone must build.
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: |
          git archive --format=tar.gz --prefix=clearcutt-portal-test/ -o "$RUNNER_TEMP/portal.tar.gz" HEAD
          tar -xzf "$RUNNER_TEMP/portal.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/clearcutt-portal-test"
          npm ci --ignore-scripts --no-audit --no-fund
          node bin/clearcutt-portal.ts build --bundle "$GITHUB_WORKSPACE/contract/fixtures/northcutted-images" --out "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/images/ghcr-io-northcutted-images-platform-tools/index.html"

  # The action with a signed bundle-ref: the showcase's estate bundle,
  # pinned by digest, signed by its estate workflow. It builds with the right
  # signer, and stops before reading anything with any other.
  action-bundle-ref:
    runs-on: ubuntu-latest
    env:
      BUNDLE_REF: ghcr.io/northcutted/clearcutt-showcase/estate@sha256:811b0f92375cb23490a9e4a4697a9c5db7ac470cf0c1132ac7ceffaa118862ef
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: portal
        uses: ./
        with:
          bundle-ref: ${{ env.BUNDLE_REF }}
          certificate-identity-regexp: ^https://github\.com/northcutted/clearcutt-showcase/\.github/workflows/estate\.yml@refs/heads/main$
          certificate-oidc-issuer: ${{ env.ISSUER }}
          output: verified-site
      - name: The site is built from the bundle that was verified
        env:
          DIR: ${{ steps.portal.outputs.dir }}
          DIGEST: ${{ steps.portal.outputs.bundle-digest }}
        run: |
          test -f "$DIR/index.html"
          test -f "$DIR/estate-report.json"
          test "$DIGEST" = "${BUNDLE_REF#*@}"
      - id: wrong-signer
        continue-on-error: true
        uses: ./
        with:
          bundle-ref: ${{ env.BUNDLE_REF }}
          certificate-identity-regexp: ^https://github\.com/northcutted/someone-else/.*$
          certificate-oidc-issuer: ${{ env.ISSUER }}
          output: wrong-signer-site
      - id: no-signer
        continue-on-error: true
        uses: ./
        with:
          bundle-ref: ${{ env.BUNDLE_REF }}
          output: no-signer-site
      - name: Without the right signer, nothing is built
        env:
          WRONG: ${{ steps.wrong-signer.outcome }}
          NONE: ${{ steps.no-signer.outcome }}
        run: |
          test "$WRONG" = failure
          test "$NONE" = failure
          test ! -e wrong-signer-site
          test ! -e no-signer-site

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # The reusable workflow end to end, short of deploying.
  workflow-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-bundle
          path: contract/examples/minimal/
  # GitHub requires the caller to grant what every job in portal.yml asks
  # for, including the deploy job that deploy: false skips. Only main may
  # deploy to the github-pages environment, so this can't publish. No
  # portal-version: the workflow builds the commit it is called at.
  workflow:
    needs: workflow-bundle
    uses: ./.github/workflows/portal.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      bundle-artifact: ci-bundle
      deploy: false
  workflow-version:
    needs: workflow
    runs-on: ubuntu-latest
    steps:
      - name: The workflow built this commit, from source
        env:
          VERSION: ${{ needs.workflow.outputs.portal-version }}
          SHA: ${{ github.sha }}
        run: test "$VERSION" = "source@$SHA"
